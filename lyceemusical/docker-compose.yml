services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/shop.db
    volumes:
      # Base SQLite (commandes) — persiste entre les redéploiements.
      - ./data:/app/data
    expose:
      - "3001"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Reverse proxy + HTTPS automatique (Let's Encrypt), renouvellement inclus.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - ./backend/.env # DOMAIN
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
