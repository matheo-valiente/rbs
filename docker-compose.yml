services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "3001"
    volumes:
      # Persist the JSON "database" (orders, tickets) across rebuilds/restarts.
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
